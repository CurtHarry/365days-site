<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>365 Days:Growth</title>
<meta name="description" content="One saying a day to help you grow, with goals you can track.">
<style>
  :root { --text: #1d1d1f; --muted: #555; --bg: #ffffff; --link: #0a58ca; }
  @media (prefers-color-scheme: dark) { :root { --text: #ececec; --muted: #a8a8a8; --bg: #141414; --link: #7fb2ff; } }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 18px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 64px 16px; text-align: center; }
  h1 { font-size: 2.2em; margin-bottom: 0.2em; }
  p { color: var(--muted); }
  a { color: var(--link); }
  .store { display: inline-block; margin: 24px 0; padding: 12px 24px; border-radius: 10px;
           background: var(--link); color: #fff; text-decoration: none; font-weight: 600; }
  footer { margin-top: 48px; font-size: 0.9em; }
</style>
</head>
<body>
<main>
  <h1>365 Days:Growth</h1>
  <p>One saying a day to help you grow, with goals you can track and widgets for your home screen.</p>
  <a class="store" href="https://play.google.com/store/apps/details?id=com.wealth.days365">Get it on Google Play</a>
  <footer><a href="/privacy/">Privacy policy</a></footer>
</main>
</body>
</html>
